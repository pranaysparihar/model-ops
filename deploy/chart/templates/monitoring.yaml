{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-metrics}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: {{ .Release.Name }}-gateway}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ .Release.Name }}-monitoring}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: modelops
        dns_sd_configs:
          - names: ['{{ .Release.Name }}-metrics.{{ .Release.Namespace }}.svc.cluster.local']
            type: A
            port: 8000
  alerts.yml: |
{{ .Files.Get "files/alerts.yml" | indent 4 }}
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: ModelOps
        type: file
        options:
          path: /var/lib/grafana/dashboards
  dashboard.json: |
{{ .Files.Get "files/dashboard.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-prometheus}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-prometheus}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-prometheus}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, runAsNonRoot: true}
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheusImage }}
          args: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus', '--storage.tsdb.retention.time=24h']
          ports: [{containerPort: 9090}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-monitoring}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-prometheus}
spec:
  selector: {app: {{ .Release.Name }}-prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-grafana}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-grafana}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 472, runAsGroup: 472, fsGroup: 472, runAsNonRoot: true}
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafanaImage }}
          ports: [{containerPort: 3000}]
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'true'}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: 'true'}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.apiKeySecret }}, key: api-key}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/default.yml, subPath: dashboards.yml}
            - {name: config, mountPath: /var/lib/grafana/dashboards/modelops.json, subPath: dashboard.json}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-monitoring}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-grafana}
spec:
  selector: {app: {{ .Release.Name }}-grafana}
  ports: [{port: 3000, targetPort: 3000}]
{{- end }}

groups:
  - name: modelops.gpu
    rules:
      - alert: GPUHardwareError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        for: 1m
        labels: {severity: critical, team: platform}
        annotations:
          summary: NVIDIA driver reports an XID error
          runbook_url: https://github.com/pranaysparihar/model-ops/blob/main/docs/gpu-runbook.md#hardware-error
      - alert: GPUMemoryPressure
        expr: DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0.95
        for: 10m
        labels: {severity: warning, team: platform}
        annotations:
          summary: GPU framebuffer memory stays above 95 percent
          runbook_url: https://github.com/pranaysparihar/model-ops/blob/main/docs/gpu-runbook.md#memory-pressure
      - alert: GPUTelemetryMissing
        expr: (sum(kube_node_status_allocatable{resource="nvidia_com_gpu"}) > 0) unless on() (count(DCGM_FI_DEV_GPU_UTIL) > 0)
        for: 10m
        labels: {severity: warning, team: platform}
        annotations:
          summary: Cluster advertises GPUs but DCGM telemetry is absent
          runbook_url: https://github.com/pranaysparihar/model-ops/blob/main/docs/gpu-runbook.md#missing-telemetry
      - alert: ModelWorkloadPending
        expr: sum(kube_pod_status_phase{namespace="modelops",phase="Pending"}) > 0
        for: 15m
        labels: {severity: warning, team: platform}
        annotations:
          summary: Model workload cannot schedule or start
          runbook_url: https://github.com/pranaysparihar/model-ops/blob/main/docs/gpu-runbook.md#pending-pod

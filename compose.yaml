name: modelops
services:
  gateway:
    build: .
    image: modelops:local
    environment:
      API_KEY: ${API_KEY:?Run scripts/init-env.sh first}
      BACKEND_URL: http://simulator:8001
      MAX_INFLIGHT: '4'
    ports: ['127.0.0.1:8080:8000']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [simulator]
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 3
  simulator:
    build: .
    image: modelops:local
    command: ['uvicorn', 'app.simulator:app', '--host', '0.0.0.0', '--port', '8001', '--no-access-log']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['127.0.0.1:9090:9090']
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_SECURITY_ADMIN_PASSWORD: ${API_KEY}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboard.json:/var/lib/grafana/dashboards/modelops.json:ro
    ports: ['127.0.0.1:3000:3000']

name: Prepare GitOps promotion
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full main-branch commit SHA whose Verify platform run succeeded
        required: true
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release and download its build digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          RUN_ID=$(gh run list --workflow ci.yml --commit "$IMAGE_TAG" --event push --status success --json headBranch,databaseId --jq '[.[] | select(.headBranch == "main")][0].databaseId')
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$RUN_ID" --name image-identity --dir artifacts
          DIGEST=$(cat artifacts/image-digest.txt)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'workload:\n  imageTag: "%s"\n  imageDigest: "%s"\n' "$IMAGE_TAG" "$DIGEST" > artifacts/promotion-values.yaml
          printf 'Review these values in your platform environment, commit them, then sync Argo CD. No cluster credentials are used here.\n' > artifacts/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-promotion-inputs
          path: artifacts/

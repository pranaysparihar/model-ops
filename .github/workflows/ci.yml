name: Verify platform
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --junitxml=artifacts/tests.xml
      - run: ruff check app tests scripts
      - run: python scripts/native-check.py
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: |
          helm lint deploy/chart
          helm template modelops deploy/chart --set monitoring.enabled=true > artifacts/simulator.yaml
          helm template modelops deploy/chart -f deploy/environments/gpu.yaml > artifacts/gpu.yaml
          python scripts/check_manifests.py artifacts/simulator.yaml artifacts/gpu.yaml
          cmp observability/alerts.yml deploy/chart/files/alerts.yml
          cmp observability/dashboard.json deploy/chart/files/dashboard.json
      - name: Validate Prometheus configuration
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/observability:/etc/prometheus" prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: artifacts/
  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: modelops-lab
          config: deploy/kind.yaml
      - name: Deploy and verify local platform
        run: ./scripts/kind-up.sh
      - name: Scan container for fixable high and critical vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 modelops:local
      - name: Failed release rollback and pod recovery
        run: ./scripts/drill.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-evidence
          path: artifacts/
  publish:
    needs: [test, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
